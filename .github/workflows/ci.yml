name: EventHub CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/js/app.js
          node --check src/routes/admin.js
          node --check src/routes/auth.js
          node --check src/routes/events.js
          node --check src/routes/registrations.js
          node --check scripts/init-db.js
          node --check scripts/seed.js
